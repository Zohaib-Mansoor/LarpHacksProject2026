# Separate Blueprint for the rating service; existing web/database stay in render.yaml.
# Creating this service registers tasks. Task execution is usage-billed by Render.
services:
  - type: workflow
    name: playcall-ratings
    runtime: node
    repo: https://github.com/Zohaib-Mansoor/LarpHacksProject2026
    branch: main
    region: ohio
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/workflow-entry.js
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: playcall-db
          property: connectionString
      - key: GEMINI_API_KEY
        fromService:
          name: playcall
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
