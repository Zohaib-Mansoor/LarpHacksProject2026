name: Integrated app checks
on:
  push:
    branches: [main, codex/backend]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rolecall
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rolecall -d api_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://rolecall:ci_only_password@localhost:5432/api_test
      DEMO_TEST_DATABASE_URL: postgresql://rolecall:ci_only_password@localhost:5432/demo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm --prefix ../web ci
      - run: npm --prefix ../web run build
      - name: Create separate integration database
        run: >-
          node --input-type=module -e 'import pg from "pg";
          const client = new pg.Client({connectionString:process.env.TEST_DATABASE_URL});
          await client.connect(); await client.query("CREATE DATABASE demo_test"); await client.end();'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
