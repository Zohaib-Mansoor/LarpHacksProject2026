services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rolecall
      POSTGRES_PASSWORD: rolecall
      POSTGRES_DB: rolecall
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - rolecall-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rolecall -d rolecall']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  rolecall-db:
